apiVersion: 1

# uid fixo: sem ele o Grafana gera um valor aleatorio a cada provisionamento, e
# os paineis que referenciam o datasource pelo uid deixam de encontra-lo.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
