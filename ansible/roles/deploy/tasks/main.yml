---
- name: Cria diretório da aplicação no host remoto
  ansible.builtin.file:
    path: /opt/comments-api
    state: directory
    mode: "0755"

- name: Copia diretório compose/ para o host remoto
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose/"
    dest: /opt/comments-api/compose/
    mode: preserve

- name: Copia diretório observability/ para o host remoto
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../observability/"
    dest: /opt/comments-api/observability/
    mode: preserve


- name: Renderiza .env com segredos do SSM
  ansible.builtin.template:
    src: env.j2
    dest: /opt/comments-api/compose/.env
    mode: "0600"

- name: Verifica se a imagem já existe no host remoto
  ansible.builtin.command: docker image inspect comments-api:local
  register: image_check
  failed_when: false
  changed_when: false

- name: Copia imagem da API (tar) para o host remoto
  ansible.builtin.copy:
    src: /tmp/comments-api-local.tar
    dest: /tmp/comments-api-local.tar
    mode: "0644"
  when: image_check.rc != 0

- name: Carrega imagem no Docker remoto
  ansible.builtin.command: docker load -i /tmp/comments-api-local.tar
  when: image_check.rc != 0

- name: Sobe a stack via Docker Compose
  ansible.builtin.command: docker compose --env-file .env up -d
  args:
    chdir: /opt/comments-api/compose
