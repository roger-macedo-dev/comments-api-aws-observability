---
# Collections exigidas pelo playbook. Instalar com:
#   ansible-galaxy collection install -r ansible/requirements.yml
#
# Limite superior em 8.0.0: as versoes 8.x exigem ansible-core mais novo que o
# usado aqui e no runner.
collections:
  # Inventario dinamico (aws_ec2) e lookup do SSM Parameter Store.
  - name: amazon.aws
    version: ">=7.6.1,<8.0.0"
  # Plugin de conexao aws_ssm — substitui SSH, que nao existe neste projeto.
  - name: community.aws
    version: ">=7.2.0,<8.0.0"
