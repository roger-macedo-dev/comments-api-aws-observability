name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
  # Permite publicar a imagem sem alterar a aplicacao — necessario, por exemplo,
  # ao validar o pipeline de deploy depois de mudancas so em infraestrutura.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comments
          POSTGRES_PASSWORD: comments
          POSTGRES_DB: comments
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://comments:comments@localhost:5432/comments
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # moderate, nao high: os avisos do qs eram moderados e passaram batido
      # ate uma revisao manual encontra-los.
      - run: npm audit --audit-level=moderate --omit=dev
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          exit-code: '1'

  build-and-push:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Constroi sem publicar para escanear antes. A varredura de filesystem
      # ve apenas as dependencias declaradas; a da imagem ve tambem os pacotes
      # do sistema operacional da base, que sao a maior fonte de CVE numa
      # imagem desatualizada.
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: comments-api:scan

      - name: Trivy — varredura da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: comments-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/comments-api:latest
            ghcr.io/${{ github.repository_owner }}/comments-api:${{ github.sha }}
