name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente alvo'
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      image_tag:
        description: 'Tag da imagem (SHA do commit). Vazio = latest.'
        required: false

jobs:
  # Define uma unica vez qual imagem sera implantada, para dev e prod
  # receberem exatamente o mesmo artefato.
  imagem:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - id: calc
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ inputs.image_tag }}"
            TAG="${TAG:-latest}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  dev:
    needs: imagem
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'dev')
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: dev
      image_tag: ${{ needs.imagem.outputs.tag }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # Producao nunca e automatica: exige disparo explicito e aprovacao humana,
  # configurada como regra de protecao do Environment.
  prod:
    needs: imagem
    if: github.event_name == 'workflow_dispatch' && inputs.ambiente == 'prod'
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: prod
      image_tag: ${{ needs.imagem.outputs.tag }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
